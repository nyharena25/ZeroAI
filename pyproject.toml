[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zeroai"
description = "Local-first assistant runtime for ZeroOS."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
authors = [{ name = "nyharena25" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[project.scripts]
zeroai = "zeroai.__main__:main"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/zeroai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroai"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["zeroai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ['if __name__ == "__main__":']

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
